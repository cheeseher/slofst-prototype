name: 临时构建语音转写包

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'tmp/asr-trigger-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取 whisper.cpp
        run: git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git

      - name: 构建 Linux 转写程序
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release -j2

      - name: 下载中文多语种模型
        run: bash whisper.cpp/models/download-ggml-model.sh small-q5_1

      - name: 打包
        run: |
          mkdir -p package
          cp whisper.cpp/build/bin/whisper-cli package/
          cp whisper.cpp/models/ggml-small-q5_1.bin package/
          chmod +x package/whisper-cli
          zip -0 -j whisper-small-q5-linux.zip package/*
          sha256sum whisper-small-q5-linux.zip > whisper-small-q5-linux.zip.sha256
          ls -lh whisper-small-q5-linux.zip*

      - name: 上传临时产物
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-linux
          path: |
            whisper-small-q5-linux.zip
            whisper-small-q5-linux.zip.sha256
          retention-days: 1
          compression-level: 0
